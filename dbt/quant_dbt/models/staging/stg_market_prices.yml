version: 2

models:
  - name: stg_market_prices
    description: "Cleaned and security-mapped daily market prices"

    columns:

      - name: trade_date
        description: "Trading date"
        tests:
          - not_null

      - name: security_id
        description: "Stable security identifier from security master"
        tests:
          - not_null

      - name: symbol
        description: "Security ticker"
        tests:
          - not_null

      - name: exchange
        description: "Exchange"
        tests:
          - not_null

      - name: open
        description: "Opening price"
        tests:
          - not_null

      - name: high
        description: "Daily high"
        tests:
          - not_null

      - name: low
        description: "Daily low"
        tests:
          - not_null

      - name: close
        description: "Closing price"
        tests:
          - not_null

      - name: adjusted_close
        description: "Adjusted closing price"
        tests:
          - not_null

      - name: volume
        description: "Trading volume"
        tests:
          - not_null
