version: 2

models:
  - name: portfolio_daily_returns
    description: >
      Daily returns generated by applying the previous trading day's
      portfolio target weights to the current trading day's security returns.

    columns:
      - name: trade_date
        description: Portfolio return date.
        tests:
          - not_null
          - unique

      - name: portfolio_daily_return
        description: Weighted daily return of the strategy.
        tests:
          - not_null
