version: 2

models:
  - name: quant_rankings
    description: >
      Cross-sectional ranking of securities by composite quantitative score.
      The top two securities are selected for the model portfolio.

    columns:

      - name: trade_date
        description: Trading date.
        tests:
          - not_null

      - name: security_id
        description: Security identifier.
        tests:
          - not_null

      - name: symbol
        description: Security ticker.
        tests:
          - not_null

      - name: composite_score
        description: Composite quantitative score.
        tests:
          - not_null

      - name: rank
        description: Cross-sectional rank for the trading date.
        tests:
          - not_null

      - name: selected_flag
        description: Whether the security belongs to the top-two portfolio.
        tests:
          - not_null
