version: 2

models:
  - name: fact_daily_prices
    description: "Daily security price fact at security-date grain"

    tests:
      - unique:
          column_name: "concat(cast(trade_date as varchar), '-', cast(security_id as varchar))"

    columns:

      - name: trade_date
        description: "Trading date"
        tests:
          - not_null

      - name: security_id
        description: "Stable security identifier"
        tests:
          - not_null

      - name: symbol
        description: "Security ticker"
        tests:
          - not_null

      - name: exchange
        description: "Exchange"
        tests:
          - not_null

      - name: open
        description: "Opening price"
        tests:
          - not_null

      - name: high
        description: "Daily high"
        tests:
          - not_null

      - name: low
        description: "Daily low"
        tests:
          - not_null

      - name: close
        description: "Unadjusted closing price"
        tests:
          - not_null

      - name: adjusted_close
        description: "Adjusted closing price used for return calculations"
        tests:
          - not_null

      - name: volume
        description: "Daily traded volume"
        tests:
          - not_null
